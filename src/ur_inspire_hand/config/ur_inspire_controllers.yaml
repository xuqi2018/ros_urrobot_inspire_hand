# Controller configuration for the ur_inspire_hand robot (UR arm + Inspire hand)
# in Gazebo. This file is passed to the gazebo_ros2_control plugin through the
# <parameters> tag in ur_inspire.urdf.xacro and therefore applies to the
# "controller_manager" node hosted inside gzserver.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz - must not be faster than the Gazebo physics step (default 1 kHz)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # UR arm (6 joints)
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Inspire RH56 hand (6 actuated finger joints; the 6 mimic joints follow
    # automatically inside gazebo_ros2_control)
    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false

hand_controller:
  ros__parameters:
    joints:
      - right_thumb_1_joint
      - right_thumb_2_joint
      - right_index_1_joint
      - right_middle_1_joint
      - right_ring_1_joint
      - right_little_1_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
    # allow trajectories that only mention a subset of the finger joints,
    # so single fingers can be commanded independently
    allow_partial_joints_goal: true
